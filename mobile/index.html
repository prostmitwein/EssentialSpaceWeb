<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Essential Space Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    if (localStorage.getItem('preferred_ui') === 'desktop') {
      window.location.href = '../desktop/index.html';
    }
  </script>

  <header class="app-header">
    <div class="brand">
      <h1>ESSENTIAL SPACE <span class="brand-version">( 2 )</span></h1>
    </div>
    <div class="header-right">
      <div id="clock">00:00</div>
      <button id="settingsBtn" class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <main class="content-area">
    <!-- Overview Tab -->
    <div id="tab-overview" class="tab-pane active">
      <section class="hero-summary">
        <h2 id="overview-hero-text">You have 0 events and 0 tasks today.</h2>
      </section>
      
      <section class="overview-section">
        <h3>EVENTS</h3>
        <div id="overview-events-list" class="list-container"></div>
      </section>

      <section class="overview-section">
        <h3>TASKS</h3>
        <div id="overview-tasks-list" class="list-container"></div>
      </section>
    </div>

    <!-- Collections Tab -->
    <div id="tab-collections" class="tab-pane">
      <div id="collections-grid" class="collections-grid">
        <!-- Cards generated by JS -->
      </div>
    </div>
  </main>

  <button id="fab-add" class="fab">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <nav class="bottom-nav">
    <button class="nav-item active" data-target="tab-overview">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Overview</span>
    </button>
    <button class="nav-item" data-target="tab-collections">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Collections</span>
    </button>
    <button class="nav-item" id="nav-search-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Search</span>
    </button>
  </nav>

  <!-- Search Overlay -->
  <div id="search-overlay" class="modal-overlay">
    <div class="search-container">
      <div class="search-header">
        <input type="text" id="searchInput" placeholder="Search memories, tags...">
        <button id="closeSearchBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="searchResults" class="collections-grid"></div>
    </div>
  </div>

  <!-- Add Modal -->
  <div id="add-modal" class="bottom-sheet">
    <div class="sheet-header">
      <h3>Add Memory</h3>
      <button class="close-sheet icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="sheet-content">
      <div class="type-selector">
        <button class="type-btn active" data-type="[NOTE]">Note</button>
        <button class="type-btn" data-type="[TASK]">Task</button>
        <button class="type-btn" data-type="[EVENT]">Event</button>
        <button class="type-btn" data-type="[PHOTO]">Photo</button>
        <button class="type-btn" data-type="[VOICE]">Voice</button>
      </div>
      <textarea id="addContent" placeholder="What's on your mind?"></textarea>
      
      <div id="extra-inputs">
        <input type="datetime-local" id="addEventDate" class="hidden">
        <input type="file" id="addPhotoInput" accept="image/*" class="hidden">
        <div id="voice-controls" class="hidden">
          <button id="recordBtn" class="btn">Start Recording</button>
          <div id="recordingStatus"></div>
        </div>
      </div>

      <input type="text" id="addTags" placeholder="Tags (comma separated)">
      <button id="saveNoteBtn" class="btn primary-btn">Save Memory</button>
    </div>
  </div>

  <!-- View Modal -->
  <div id="view-modal" class="bottom-sheet">
    <div class="sheet-header">
      <h3 id="view-type"></h3>
      <div class="header-actions">
        <button id="viewPinBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <button id="viewDeleteBtn" class="icon-btn delete-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <button class="close-sheet icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
    <div class="sheet-content" id="view-content-area">
      <!-- Content populated via JS -->
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="bottom-sheet">
    <div class="sheet-header">
      <h3>Settings</h3>
      <button class="close-sheet icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="sheet-content">
      <div class="setting-item">
        <span>Theme</span>
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="setting-item">
        <span>Switch to Desktop UI</span>
        <button id="switchToDesktop" class="btn">Switch</button>
      </div>
    </div>
  </div>

  <script src="../db.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
